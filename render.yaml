services:
  # 1. Spring Boot 3 Backend Web Service
  - type: web
    name: finance-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: financedb
          property: host
      - key: DB_PORT
        fromDatabase:
          name: financedb
          property: port
      - key: DB_NAME
        fromDatabase:
          name: financedb
          property: database
      - key: DB_USER
        fromDatabase:
          name: financedb
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: financedb
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_JWT_SECRET
        generateValue: true

  # 2. React 18 Frontend Static Site (Served globally via Render CDN)
  - type: web
    name: finance-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://finance-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Managed PostgreSQL Database
  - name: financedb
    databaseName: financedb
    plan: free
    region: oregon
